[package]
name = "labeldesk"
version = "0.1.0"
description = "LabelDesk - Windows 标签设计与热敏打印工具"
authors = ["LabelDesk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "labeldesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
