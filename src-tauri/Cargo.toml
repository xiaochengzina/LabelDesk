[package]
name = "labeldesk"
version = "0.0.2"
description = "LabelDesk - Windows 标签设计与热敏打印工具"
authors = ["LabelDesk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "labeldesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标。关闭窗口即销毁 WebView 并退出进程（释放内存），
# 需要时从托盘图标重新拉起。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
